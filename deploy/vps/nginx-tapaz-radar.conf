# /etc/nginx/sites-available/tapaz-radar  → sonra sites-enabled-e symlink
server {
    listen 80;
    server_name radar.senin-domenin.az;   # <-- oz domenini yaz (ve ya server IP)

    root /opt/tapaz-radar/out;
    index dashboard.html;

    # Esas sehife dashboard-u acsin
    location = / {
        try_files /dashboard.html =404;
    }
    location / {
        try_files $uri /dashboard.html;
    }

    # Opsional: sifre ile qoru (telefon nomreleri var)
    #   sudo apt install apache2-utils
    #   sudo htpasswd -c /etc/nginx/.htpasswd ilkin
    # sonra asagidaki 2 setri ac:
    # auth_basic "tap.az Radar";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    gzip on;
    gzip_types text/html application/javascript;
}
